<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kitchen</title><style>body{font-family:sans-serif;padding:12px}.o{border:1px solid #ccc;margin:8px 0;padding:8px}.muted{color:#555}</style></head><body>
<h2 id='title'>Kitchen</h2><div id='orders'></div><script>
const q=new URLSearchParams(location.search); const kitchenId=q.get('kitchenId')||'1';
async function load(){
 const ks=await fetch('/api/v1/kitchens').then(r=>r.json()); const k=ks.find(x=>String(x.id)===String(kitchenId)); document.getElementById('title').textContent='Kitchen '+(k?k.name:kitchenId);
 const list=await fetch('/api/v1/kitchens/'+kitchenId+'/orders').then(r=>r.json());
 document.getElementById('orders').innerHTML=list.map(o=>`<div class='o'><div><b>N ${o.progressiveNumber}</b> • ${o.status}</div><div class='muted'>Tavolo: ${o.tableNo||'-'} • Note: ${o.orderNote||'-'}</div>${(o.items||[]).map(i=>`<div>${i.qty} ${i.dishName} ${(i.optionLabels||[]).join(', ')} <span class='muted'>${i.itemNote||''}</span></div>`).join('')}<div><b>Totale cucina:</b> ${o.kitchenTotalAmount} € • <b>Grammatura:</b> ${o.totalWeightFormatted||'-'}</div><button onclick='del(${o.id})'>DELETE</button></div>`).join('');
}
async function del(id){ await fetch('/api/v1/kitchen-orders/'+id,{method:'DELETE'}); await load(); }
setInterval(load,1000); load();
</script></body></html>
