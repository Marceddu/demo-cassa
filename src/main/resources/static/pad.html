<script>
let kitchens = [];
let dishesByKitchen = {};
let options = [];
let state = {};
let isSending = false;

const m = v => Number(v || 0).toFixed(2);

function st(id) {
  id = String(id);
  if (!state[id]) state[id] = { qty: 0, itemNote: "", optionIds: [] };
  return state[id];
}

function resetForm() {
  state = {};
  document.getElementById("notes").value = "";
  document.getElementById("tableNo").value = "";
  document.getElementById("msg").textContent = "Ordine inviato con successo";
  render();
}

async function load() {
  if (isSending) return;

  kitchens = await fetch("/api/v1/kitchens").then(r => r.json());
  options = await fetch("/api/v1/order-options").then(r => r.json()).catch(() => []);

  for (const k of kitchens) {
    dishesByKitchen[k.id] = await fetch("/api/v1/kitchens/" + k.id + "/dishes").then(r => r.json());
  }

  render();
}

function render() {
  let gt = 0;
  const kt = [];

  document.getElementById("root").innerHTML = kitchens.map(k => {
    let tot = 0;

    const b = (dishesByKitchen[k.id] || []).map(d => {
      const s = st(d.id);
      const sub = (s.qty || 0) * Number(d.price || 0);

      tot += sub;
      gt += sub;

      return `
        <div class="dish">
          <div>
            <b>${d.name}</b>
            <div class="muted">${m(d.price)} €</div>
            <div>
              ${options.map(o => `
                <label>
                  <input type="checkbox"
                         data-d="${d.id}"
                         data-o="${o.id}"
                         ${s.optionIds.includes(o.id) ? "checked" : ""}>
                  ${o.label}
                </label>
              `).join(" ")}
            </div>
          </div>

          <div class="q">
            <button data-a="m" data-id="${d.id}">-</button>
            <b>${s.qty}</b>
            <button data-a="p" data-id="${d.id}">+</button>
          </div>

          <div>
            <input class="in"
                   data-n="${d.id}"
                   value="${s.itemNote || ""}"
                   placeholder="nota riga">
            <div>${m(sub)} €</div>
          </div>
        </div>
      `;
    }).join("");

    kt.push(`<div>${k.name}: <b>${m(tot)} €</b></div>`);
    return `<div class="k"><h3>${k.name}</h3>${b}</div>`;
  }).join("");

  document.getElementById("gt").textContent = m(gt);
  document.getElementById("ktot").innerHTML = kt.join("");
}

document.body.addEventListener("click", e => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;

  const s = st(b.dataset.id);
  s.qty = Math.max(0, (s.qty || 0) + (b.dataset.a === "p" ? 1 : -1));
  render();
});

document.body.addEventListener("change", e => {
  if (e.target.dataset.n) {
    st(e.target.dataset.n).itemNote = e.target.value;
  }

  if (e.target.dataset.o) {
    const s = st(e.target.dataset.d);
    const o = Number(e.target.dataset.o);

    if (e.target.checked) {
      if (!s.optionIds.includes(o)) s.optionIds.push(o);
    } else {
      s.optionIds = s.optionIds.filter(x => x !== o);
    }
  }
});

document.getElementById("send").onclick = async () => {
  const items = [];
  const kitchensInvolved = new Set();

  Object.entries(state).forEach(([id, s]) => {
    if ((s.qty || 0) > 0) {
      items.push({
        dishId: Number(id),
        qty: s.qty,
        itemNote: s.itemNote,
        optionIds: s.optionIds
      });

      const k = kitchens.find(x =>
        (dishesByKitchen[x.id] || []).some(d => d.id === Number(id))
      );

      if (k) kitchensInvolved.add(k.name);
    }
  });

  if (!items.length) {
    document.getElementById("msg").textContent = "Seleziona almeno un piatto";
    return;
  }

  const payload = {
    status: "NEW",
    tableNo: document.getElementById("tableNo").value,
    notes: document.getElementById("notes").value,
    items
  };

  try {
    isSending = true;

    const response = await fetch("/setordine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const text = await response.text();

    if (!response.ok) {
      document.getElementById("msg").textContent = "Errore invio ordine: " + text;
      return;
    }

    const details = Array.from(kitchensInvolved).map(n => `<li>${n}</li>`).join("");

    document.getElementById("last").innerHTML = `
      <div>Ordine inviato ✅</div>
      <div>Piatti: ${items.map(i => i.qty + "x #" + i.dishId).join(", ")}</div>
      <div>Cucine:<ul>${details}</ul></div>
    `;

    resetForm();
  } catch (e) {
    document.getElementById("msg").textContent = "Errore invio ordine: " + e.message;
  } finally {
    isSending = false;
  }
};

load();
</script>
