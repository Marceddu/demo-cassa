<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pad</title>
<style>
:root {
  --bg: #0b1220;
  --card: #111a2e;
  --line: #2a3b63;
  --txt: #eaf0ff;
  --muted: #9fb0d9;
  --p: #5b8cff;
  --d: #ef4444;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font-family: Inter, system-ui, sans-serif;
}

.wrap {
  max-width: 980px;
  margin: 20px auto;
  padding: 0 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}

.k {
  border: 1px solid #274375;
  border-radius: 12px;
  padding: 10px;
  margin: 10px 0;
}

.dish {
  display: grid;
  grid-template-columns: 2fr 130px 1fr;
  gap: 10px;
  align-items: center;
  margin: 8px 0;
}

.q button {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid #38548a;
  background: #0f172a;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
}

.q {
  display: flex;
  align-items: center;
  gap: 8px;
}

.in {
  background: #0f172a;
  border: 1px solid #304674;
  border-radius: 10px;
  color: #fff;
  padding: 8px;
}

.btn {
  border: none;
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--p), #7aa2ff);
  color: #fff;
  cursor: pointer;
  margin-right: 8px;
}

.btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.muted {
  color: var(--muted);
}

.last-line {
  margin: 4px 0;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>Pad ordini</h1>

    <div>
      Tavolo <input id="tableNo" class="in">
      Note ordine <input id="notes" class="in" style="width:60%">
    </div>

    <div style="margin-top:12px">
      <button id="send" class="btn" type="button">Invia ordine</button>
      <button id="refreshMenu" class="btn" type="button">Aggiorna menu</button>
    </div>

    <div id="msg" class="muted" style="margin-top:8px"></div>

    <div id="root"></div>
    <div id="ktot"></div>

    <h3>Totale generale: <span id="gt">0.00</span> €</h3>
  </div>

  <div class="card">
    <h2>Ultimo ordine inviato</h2>
    <div id="last" class="muted">Nessuno</div>
  </div>
</div>

<script>
let kitchens = [];
let dishesByKitchen = {};
let options = [];
let state = {};
let isSending = false;

const money = v => Number(v || 0).toFixed(2);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[m]));
}

function getState(dishId) {
  const id = String(dishId);
  if (!state[id]) {
    state[id] = {
      qty: 0,
      itemNote: "",
      optionIds: []
    };
  }
  return state[id];
}

function hasCurrentOrder() {
  return Object.values(state).some(s => (s.qty || 0) > 0);
}

function getDishById(id) {
  const numericId = Number(id);
  for (const k of kitchens) {
    const dish = (dishesByKitchen[k.id] || []).find(d => Number(d.id) === numericId);
    if (dish) return { dish, kitchen: k };
  }
  return null;
}

async function load() {
  try {
    document.getElementById("msg").textContent = "Caricamento menu...";

    kitchens = await fetch("/api/v1/kitchens").then(r => r.json());
    options = await fetch("/api/v1/order-options").then(r => r.json()).catch(() => []);

    for (const k of kitchens) {
      dishesByKitchen[k.id] = await fetch("/api/v1/kitchens/" + k.id + "/dishes").then(r => r.json());
    }

    document.getElementById("msg").textContent = "";
    render();
  } catch (e) {
    document.getElementById("msg").textContent = "Errore caricamento menu: " + e.message;
  }
}

function render() {
  let grandTotal = 0;
  const totalsHtml = [];

  document.getElementById("root").innerHTML = kitchens.map(k => {
    let kitchenTotal = 0;

    const dishesHtml = (dishesByKitchen[k.id] || []).map(d => {
      const s = getState(d.id);
      const subtotal = (s.qty || 0) * Number(d.price || 0);
      kitchenTotal += subtotal;
      grandTotal += subtotal;

      const optionHtml = options.map(o => `
        <label>
          <input type="checkbox"
                 data-d="${d.id}"
                 data-o="${o.id}"
                 ${s.optionIds.includes(Number(o.id)) ? "checked" : ""}>
          ${esc(o.label)}
        </label>
      `).join(" ");

      return `
        <div class="dish">
          <div>
            <b>${esc(d.name)}</b>
            <div class="muted">${money(d.price)} €</div>
            <div>${optionHtml}</div>
          </div>

          <div class="q">
            <button type="button" data-a="m" data-id="${d.id}">-</button>
            <b>${s.qty}</b>
            <button type="button" data-a="p" data-id="${d.id}">+</button>
          </div>

          <div>
            <input class="in"
                   data-n="${d.id}"
                   value="${esc(s.itemNote || "")}"
                   placeholder="nota riga">
            <div>${money(subtotal)} €</div>
          </div>
        </div>
      `;
    }).join("");

    totalsHtml.push(`<div>${esc(k.name)}: <b>${money(kitchenTotal)} €</b></div>`);

    return `
      <div class="k">
        <h3>${esc(k.name)}</h3>
        ${dishesHtml || "<div class='muted'>Nessun piatto</div>"}
      </div>
    `;
  }).join("");

  document.getElementById("gt").textContent = money(grandTotal);
  document.getElementById("ktot").innerHTML = totalsHtml.join("");
}

function buildOrderSnapshot() {
  const tableNo = document.getElementById("tableNo").value;
  const notes = document.getElementById("notes").value;

  const snapshot = {
    tableNo,
    notes,
    items: [],
    totalsByKitchen: {},
    grandTotal: 0
  };

  for (const [dishId, s] of Object.entries(state)) {
    if ((s.qty || 0) <= 0) continue;

    const found = getDishById(dishId);
    if (!found) continue;

    const { dish, kitchen } = found;
    const subtotal = Number(dish.price || 0) * Number(s.qty || 0);

    const selectedOptions = (s.optionIds || [])
      .map(id => options.find(o => Number(o.id) === Number(id)))
      .filter(Boolean)
      .map(o => o.label);

    snapshot.items.push({
      dishId: Number(dishId),
      dishName: dish.name,
      kitchenId: kitchen.id,
      kitchenName: kitchen.name,
      qty: s.qty,
      itemNote: s.itemNote || "",
      optionIds: [...(s.optionIds || [])],
      optionLabels: selectedOptions,
      subtotal
    });

    snapshot.totalsByKitchen[kitchen.name] = (snapshot.totalsByKitchen[kitchen.name] || 0) + subtotal;
    snapshot.grandTotal += subtotal;
  }

  return snapshot;
}

function showLastOrder(snapshot) {
  const lines = snapshot.items.map(i => {
    const opts = i.optionLabels.length ? " - " + i.optionLabels.map(esc).join(", ") : "";
    const note = i.itemNote ? ` <span class="muted">(${esc(i.itemNote)})</span>` : "";
    return `<div class="last-line">${i.qty} x ${esc(i.dishName)}${opts}${note}</div>`;
  }).join("");

  const totals = Object.entries(snapshot.totalsByKitchen).map(([name, total]) =>
    `<div>${esc(name)}: <b>${money(total)} €</b></div>`
  ).join("");

  document.getElementById("last").innerHTML = `
    <div><b>Ordine inviato ✅</b></div>
    ${snapshot.tableNo ? `<div>Tavolo: ${esc(snapshot.tableNo)}</div>` : ""}
    ${snapshot.notes ? `<div>Note ordine: ${esc(snapshot.notes)}</div>` : ""}
    <hr>
    ${lines}
    <hr>
    ${totals}
    <div>Totale generale: <b>${money(snapshot.grandTotal)} €</b></div>
  `;
}

function resetOrderForm() {
  state = {};
  document.getElementById("tableNo").value = "";
  document.getElementById("notes").value = "";
  document.getElementById("msg").textContent = "Ordine inviato con successo";
  render();
}

document.body.addEventListener("click", e => {
  const btn = e.target.closest("button[data-a]");
  if (!btn || isSending) return;

  const s = getState(btn.dataset.id);
  s.qty = Math.max(0, (s.qty || 0) + (btn.dataset.a === "p" ? 1 : -1));
  render();
});

document.body.addEventListener("input", e => {
  if (e.target.dataset.n) {
    getState(e.target.dataset.n).itemNote = e.target.value;
  }
});

document.body.addEventListener("change", e => {
  if (!e.target.dataset.o) return;

  const s = getState(e.target.dataset.d);
  const optionId = Number(e.target.dataset.o);

  if (e.target.checked) {
    if (!s.optionIds.includes(optionId)) s.optionIds.push(optionId);
  } else {
    s.optionIds = s.optionIds.filter(x => x !== optionId);
  }
});

document.getElementById("refreshMenu").onclick = async () => {
  if (hasCurrentOrder()) {
    const ok = confirm("Hai un ordine in corso. Aggiornare il menu e perdere le selezioni?");
    if (!ok) return;
  }

  state = {};
  await load();
};

document.getElementById("send").onclick = async () => {
  if (isSending) return;

  const sendBtn = document.getElementById("send");
  const msg = document.getElementById("msg");

  const snapshot = buildOrderSnapshot();

  if (!snapshot.items.length) {
    msg.textContent = "Seleziona almeno un piatto";
    return;
  }

  const payload = {
    status: "NEW",
    tableNo: snapshot.tableNo,
    notes: snapshot.notes,
    items: snapshot.items.map(i => ({
      dishId: i.dishId,
      qty: i.qty,
      itemNote: i.itemNote,
      optionIds: i.optionIds
    }))
  };

  try {
    isSending = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "Invio...";
    msg.textContent = "Invio ordine...";

    const response = await fetch("/setordine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const responseText = await response.text();

    if (!response.ok) {
      msg.textContent = "Errore invio ordine: " + responseText;
      return;
    }

    showLastOrder(snapshot);
    resetOrderForm();

  } catch (e) {
    msg.textContent = "Errore invio ordine: " + e.message;
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    sendBtn.textContent = "Invia ordine";
  }
};

load();
</script>
</body>
</html>
