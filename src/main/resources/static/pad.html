<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Pad</title><style>body{font-family:sans-serif;padding:12px}.k{border:1px solid #ccc;padding:10px;margin:10px 0}.dish{display:grid;grid-template-columns:2fr 1fr 120px 120px;gap:8px;align-items:center;margin:6px 0}.btn{padding:8px}.tot{font-weight:bold}.err{color:#b00}</style></head><body>
<h2>Pad multi-cucina</h2><div>Tavolo <input id='tableNo'> Note ordine <input id='notes' style='width:50%'></div><div id='err' class='err'></div><div id='root'></div><div class='tot'>Totale generale: <span id='gt'>0.00</span> €</div><button id='send' class='btn'>Invia ordine</button><pre id='res'></pre>
<script>
let kitchens=[], dishesByKitchen={}, options=[], state={};
const €=v=>Number(v||0).toFixed(2);
function ensure(d){ if(!state[d.id]) state[d.id]={qty:0,itemNote:'',optionIds:[]}; return state[d.id]; }
function render(){
 const root=document.getElementById('root'); let gt=0; root.innerHTML='';
 kitchens.forEach(k=>{ const ds=dishesByKitchen[k.id]||[]; let kt=0; const div=document.createElement('div'); div.className='k'; div.innerHTML=`<h3>${k.name}</h3>`;
 ds.forEach(d=>{const st=ensure(d); const sub=(st.qty||0)*Number(d.price||0); kt+=sub; gt+=sub; const row=document.createElement('div'); row.className='dish';
 row.innerHTML=`<div><b>${d.name}</b><br><small>${€(d.price)} €</small><br><small>${(options.filter(o=>o.active!==false).map(o=>`<label><input type='checkbox' data-d='${d.id}' data-o='${o.id}' ${st.optionIds.includes(o.id)?'checked':''}>${o.label}</label>`).join(' '))}</small></div><div><button data-a='m' data-id='${d.id}'>-</button> <b>${st.qty}</b> <button data-a='p' data-id='${d.id}'>+</button></div><div><input data-n='${d.id}' placeholder='nota riga' value='${st.itemNote||''}'></div><div>${€(sub)} €</div>`;
 div.appendChild(row);
 });
 div.innerHTML += `<div class='tot'>Totale ${k.name}: ${€(kt)} €</div>`; root.appendChild(div);
 });
 document.getElementById('gt').textContent=€(gt);
}
async function load(){ kitchens=await fetch('/api/v1/kitchens').then(r=>r.json()); options=await fetch('/api/v1/order-options').then(r=>r.json()).catch(()=>[]); for(const k of kitchens){ dishesByKitchen[k.id]=await fetch('/api/v1/kitchens/'+k.id+'/dishes').then(r=>r.json()); } render(); }
document.body.addEventListener('click',e=>{const b=e.target.closest('button[data-a]'); if(!b) return; const st=ensure({id:Number(b.dataset.id)}); st.qty=Math.max(0,(st.qty||0)+(b.dataset.a==='p'?1:-1)); render();});
document.body.addEventListener('change',e=>{if(e.target.dataset.n){ensure({id:Number(e.target.dataset.n)}).itemNote=e.target.value;} if(e.target.dataset.o){const d=Number(e.target.dataset.d),o=Number(e.target.dataset.o),st=ensure({id:d}); if(e.target.checked){if(!st.optionIds.includes(o))st.optionIds.push(o);} else st.optionIds=st.optionIds.filter(x=>x!==o);} });
document.getElementById('send').onclick=async()=>{const items=[]; Object.entries(state).forEach(([id,s])=>{if((s.qty||0)>0)items.push({dishId:Number(id),qty:s.qty,itemNote:s.itemNote,optionIds:s.optionIds});}); if(!items.length){document.getElementById('err').textContent='Seleziona almeno un piatto';return;} const payload={status:'NEW',tableNo:document.getElementById('tableNo').value,notes:document.getElementById('notes').value,items}; const r=await fetch('/setordine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); document.getElementById('res').textContent=await r.text(); };
load(); setInterval(load,1000);
</script></body></html>
