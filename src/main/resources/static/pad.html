<!doctype html>
<html lang='it'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Pad</title>
<style>
:root {
	--bg: #0b1220;
	--card: #111a2e;
	--line: #2a3b63;
	--txt: #eaf0ff;
	--muted: #9fb0d9;
	--p: #5b8cff;
	--d: #ef4444
}

body {
	margin: 0;
	background: var(--bg);
	color: var(--txt);
	font-family: Inter, system-ui
}

.wrap {
	max-width: 980px;
	margin: 20px auto;
	padding: 0 16px
}

.card {
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 14px;
	padding: 16px;
	margin-bottom: 12px
}

.k {
	border: 1px solid #274375;
	border-radius: 12px;
	padding: 10px;
	margin: 10px 0
}

.dish {
	display: grid;
	grid-template-columns: 2fr 130px 1fr;
	gap: 10px;
	align-items: center;
	margin: 8px 0
}

.q button {
	width: 42px;
	height: 42px;
	border-radius: 12px;
	border: 1px solid #38548a;
	background: #0f172a;
	color: #fff;
	font-size: 22px
}

.q {
	display: flex;
	align-items: center;
	gap: 8px
}

.in {
	background: #0f172a;
	border: 1px solid #304674;
	border-radius: 10px;
	color: #fff;
	padding: 8px
}

.btn {
	border: none;
	border-radius: 12px;
	padding: 10px 14px;
	font-weight: 700;
	background: linear-gradient(135deg, var(--p), #7aa2ff);
	color: #fff
}

.muted {
	color: var(--muted)
}
</style>
</head>
<body>
	<div class='wrap'>
		<div class='card'>
			<h1>Pad ordini</h1>
			<div>
				Tavolo <input id='tableNo' class='in'> Note ordine <input
					id='notes' class='in' style='width: 60%'>
			</div>
			<div id='root'></div>
			<div id='ktot'></div>
			<h3>
				Totale generale: <span id='gt'>0.00</span> €
			</h3>
			<button id='send' class='btn'>Invia ordine</button>
			<div id='msg' class='muted'></div>
		</div>
		<div class='card'>
			<h2>Ultimo ordine inviato</h2>
			<div id='last' class='muted'>Nessuno</div>
		</div>
	</div>
	<script>
let kitchens=[],dishesByKitchen={},options=[],state={}; const m=v=>Number(v||0).toFixed(2);
function st(id){if(!state[id])state[id]={qty:0,itemNote:'',optionIds:[]}; return state[id];}
function resetForm(){Object.keys(state).forEach(k=>state[k]={qty:0,itemNote:'',optionIds:[]}); document.getElementById('notes').value=''; document.getElementById('tableNo').value=''; render();}
async function load(){kitchens=await fetch('/api/v1/kitchens').then(r=>r.json()); options=await fetch('/api/v1/order-options').then(r=>r.json()).catch(()=>[]); for(const k of kitchens){dishesByKitchen[k.id]=await fetch('/api/v1/kitchens/'+k.id+'/dishes').then(r=>r.json());} render();}
function render(){let gt=0; const kt=[]; document.getElementById('root').innerHTML=kitchens.map(k=>{let tot=0; const b=(dishesByKitchen[k.id]||[]).map(d=>{const s=st(d.id); const sub=(s.qty||0)*Number(d.price||0); tot+=sub; gt+=sub; return `<div class='dish'><div><b>${d.name}</b><div class='muted'>${m(d.price)} €</div><div>${options.map(o=>`<label><input type='checkbox' data-d='${d.id}' data-o='${o.id}' ${s.optionIds.includes(o.id)?'checked':''}>${o.label}</label>`).join(' ')}</div></div><div class='q'><button data-a='m' data-id='${d.id}'>-</button><b>${s.qty}</b><button data-a='p' data-id='${d.id}'>+</button></div><div><input class='in' data-n='${d.id}' value='${s.itemNote||''}' placeholder='nota riga'><div>${m(sub)} €</div></div></div>`}).join(''); kt.push(`<div>${k.name}: <b>${m(tot)} €</b></div>`); return `<div class='k'><h3>${k.name}</h3>${b}</div>`;}).join(''); document.getElementById('gt').textContent=m(gt); document.getElementById('ktot').innerHTML=kt.join('');}
document.body.addEventListener('click',e=>{const b=e.target.closest('button[data-a]'); if(!b)return; const s=st(b.dataset.id); s.qty=Math.max(0,(s.qty||0)+(b.dataset.a==='p'?1:-1)); render();});
document.body.addEventListener('change',e=>{if(e.target.dataset.n) st(e.target.dataset.n).itemNote=e.target.value; if(e.target.dataset.o){const s=st(e.target.dataset.d),o=Number(e.target.dataset.o); if(e.target.checked){if(!s.optionIds.includes(o))s.optionIds.push(o);} else s.optionIds=s.optionIds.filter(x=>x!==o);}});
document.getElementById('send').onclick=async()=>{const items=[]; const kitchensInvolved=new Set(); Object.entries(state).forEach(([id,s])=>{if((s.qty||0)>0){items.push({dishId:Number(id),qty:s.qty,itemNote:s.itemNote,optionIds:s.optionIds}); const k=kitchens.find(x=>(dishesByKitchen[x.id]||[]).some(d=>d.id===Number(id))); if(k) kitchensInvolved.add(k.name);}}); if(!items.length)return; const payload={status:'NEW',tableNo:tableNo.value,notes:notes.value,items}; const resp=await fetch('/setordine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());
 const details=Array.from(kitchensInvolved).map(n=>`<li>${n}</li>`).join(''); document.getElementById('last').innerHTML=`<div>Ordine inviato ✅</div><div>Piatti: ${items.map(i=>i.qty+'x#'+i.dishId).join(', ')}</div><div>Cucine:<ul>${details}</ul></div>`; document.getElementById('msg').textContent='Ordine inviato con successo'; resetForm();};
load();
</script>
</body>
</html>
