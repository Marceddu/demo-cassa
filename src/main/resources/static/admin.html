<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin</title><style>:root{--bg:#0b1220;--card:#121c32;--line:#28406d;--txt:#eef4ff}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui}.wrap{max-width:980px;margin:20px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.in{padding:8px;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #35528a}</style></head><body><div class='wrap'><h1>Admin</h1><div class='card'><h2>Piatti</h2><div>Nome<input id='n' class='in'> Prezzo<input id='p' class='in' type='number' step='0.01'> KitchenId<input id='k' class='in' type='number'> Weight<input id='w' class='in' type='number'><button onclick='addDish()'>Aggiungi</button></div><div id='d'></div></div><div class='card'><h2>Opzioni</h2><div>Label<input id='ol' class='in'><button onclick='addOpt()'>Aggiungi</button></div><div id='o'></div></div></div><script>async function load(){const ds=await fetch('/admin/piatti').then(r=>r.json()); d.innerHTML=ds.map(x=>`<div>${x.name} €${x.price} kitchen:${x.kitchenId||'-'} weight:${x.weightGrams||'-'} active:${x.active}</div>`).join(''); const os=await fetch('/api/v1/order-options').then(r=>r.json()); o.innerHTML=os.map(x=>`<div>${x.label} <button onclick='togOpt(${x.id})'>toggle</button></div>`).join('');} async function addDish(){await fetch('/admin/piatti',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,price:Number(p.value),kitchenId:Number(k.value),weightGrams:Number(w.value),active:true})});load();} async function addOpt(){await fetch('/api/v1/order-options',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:ol.value,active:true})});load();} async function togOpt(id){await fetch('/api/v1/order-options/'+id+'/toggle',{method:'PATCH'});load();} load();</script></body></html>
