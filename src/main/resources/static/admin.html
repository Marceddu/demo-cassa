<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin</title><style>body{font-family:sans-serif;padding:12px}.c{border:1px solid #ccc;padding:8px;margin:8px 0}</style></head><body>
<h2>Admin piatti</h2><div>Nome<input id='n'> Prezzo<input id='p' type='number' step='0.01'> KitchenId<input id='k'> WeightGrams<input id='w' type='number'><button onclick='addDish()'>Aggiungi</button></div><div id='d'></div>
<h2>Opzioni</h2><div>Label<input id='ol'> <button onclick='addOpt()'>Aggiungi opzione</button></div><div id='o'></div>
<script>
async function load(){ const dishes=await fetch('/admin/piatti').then(r=>r.json()); document.getElementById('d').innerHTML=dishes.map(x=>`<div class='c'><b>${x.name}</b> €${x.price} kitchenId:${x.kitchenId||'-'} weight:${x.weightGrams||'-'} active:${x.active} <button onclick='togDish(${x.id},${!x.active})'>toggle</button></div>`).join(''); const opts=await fetch('/api/v1/order-options').then(r=>r.json()); document.getElementById('o').innerHTML=opts.map(x=>`<div class='c'>${x.label} active:${x.active} <button onclick='togOpt(${x.id})'>toggle</button></div>`).join(''); }
async function addDish(){await fetch('/admin/piatti',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,price:Number(p.value),kitchenId:Number(k.value),weightGrams:Number(w.value),active:true})});load();}
async function togDish(id,a){await fetch('/admin/piatti/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:a})});load();}
async function addOpt(){await fetch('/api/v1/order-options',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:ol.value,active:true})});load();}
async function togOpt(id){await fetch('/api/v1/order-options/'+id+'/toggle',{method:'PATCH'});load();}
load();
</script></body></html>
